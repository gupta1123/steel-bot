[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "https://steel-whatsapp-solutionnyx-8b41f30f3c58.herokuapp.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://steel-whatsapp-solutionnyx-8b41f30f3c58.herokuapp.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/admin/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/admin/"
  status = 302
  force = true
